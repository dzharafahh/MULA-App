<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F5E4">
<title>Masuk — MULA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#132A13;--deep:#31572C;--cream:#F8F5E4;--soft:#FEFEFE;--body:#404943;--ph:#858585;--bg:#EBEEE6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--body);display:flex;align-items:center;justify-content:center}
.screen{width:100%;max-width:402px;min-height:100dvh;max-height:874px;background:var(--cream);overflow-y:auto;padding:calc(56px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:520px){.screen{border-radius:38px;box-shadow:0 24px 70px rgba(19,42,19,.18);height:874px}}
h1{font-size:28px;font-weight:700;line-height:1.2;color:var(--deep);text-align:center;max-width:240px;margin:0 auto}
.sub{font-size:14px;line-height:1.45;color:var(--ink);text-align:center;margin:14px 8px 20px}
label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin:0 0 6px 2px}
.field{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;min-height:48px;padding:0 14px;box-shadow:0 1px 3px rgba(19,42,19,.08);margin-bottom:10px}
.field:focus-within{outline:3px solid var(--deep);outline-offset:1px}
.field.bad{outline:2px solid var(--deep)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:400 14px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:46px;outline:0}
.field input::placeholder{color:var(--ph)}
.field svg{flex-shrink:0}
.eye{background:0;border:0;display:grid;place-items:center;width:44px;height:44px;margin-right:-10px;cursor:pointer}
.help{font:400 11px 'Nunito','Plus Jakarta Sans',sans-serif;color:var(--ink);margin:-4px 2px 8px;min-height:14px}
.help.err{font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:999px;border:0;background:var(--soft);color:var(--ink);font:700 14px 'Plus Jakarta Sans',system-ui,sans-serif;margin:8px 0;padding:0 16px;box-shadow:0 1px 3px rgba(19,42,19,.08);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--deep);color:#fff}
.btn[disabled]{cursor:progress}
.btn:active{transform:scale(.99)}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.btn.primary:focus-visible{outline-color:var(--ink)}
.note{font:400 11px 'Nunito','Plus Jakarta Sans',sans-serif;color:var(--ink);margin:2px 2px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));max-width:360px;width:calc(100% - 36px);background:#AEF1CC;color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.15);z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="screen">
  <h1>Selamat datang kembali</h1>
  <p class="sub">Masuk untuk menyimpan Jejak Langkahmu, atau mulai langsung tanpa akun.</p>

  <form id="f" novalidate>
    <label for="email">Email</label>
    <div class="field" id="fe">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#132A13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nama@gmail.com" aria-describedby="he">
    </div>
    <p class="help err" id="he" role="alert" hidden></p>

    <label for="pw">Kata Sandi</label>
    <div class="field" id="fp">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#132A13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="hp">
      <button type="button" class="eye" id="eye" aria-label="Tampilkan kata sandi" aria-pressed="false">
        <svg id="eyeI" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#132A13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.500 7 10.500 7-4 7-10.500 7S1.500 12 1.500 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p class="help err" id="hp" role="alert" hidden></p>

    <a class="btn" href="index.html" data-goto="forgot">Lupa kata sandi?</a>
    <button class="btn primary" type="submit" id="go">Masuk</button>
    <button class="btn" type="button" id="google">Lanjutkan dengan Google</button>
    <button class="btn" type="button" id="guest">Lanjut Tanpa Akun</button>
    <p class="note">Data tersimpan di perangkat ini saja.</p>
    <a class="btn" href="index.html" data-goto="signup" style="margin-top:10px">Belum punya akun? Daftar</a>
  </form>
</main>

<script>
(function(){
  'use strict';
  var KEY='mula.v2',$=function(s){return document.querySelector(s)};
  var email=$('#email'),pw=$('#pw'),he=$('#he'),hp=$('#hp'),go=$('#go'),busy=false;

  function toast(m){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
  function msg(el,t,box){el.textContent=t||'';el.hidden=!t;box.classList.toggle('bad',!!t)}
  function clear(){msg(he,'',$('#fe'));msg(hp,'',$('#fp'))}
  function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}

  /* simpan ke state aplikasi utama agar index.html langsung membuka Beranda */
  function patch(fn){var s={};try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}fn(s);try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
  function enter(mode,addr){patch(function(s){s.mode=mode;s.onb=true;if(addr){s.user=s.user||{};s.user.email=addr}});location.href='index.html'}

  $('#eye').addEventListener('click',function(){
    var show=pw.type==='password';pw.type=show?'text':'password';
    this.setAttribute('aria-pressed',show);this.setAttribute('aria-label',show?'Sembunyikan kata sandi':'Tampilkan kata sandi');
    $('#eyeI').style.opacity=show?.55:1;pw.focus();
  });

  [email,pw].forEach(function(i){i.addEventListener('input',clear)});

  $('#f').addEventListener('submit',function(e){
    e.preventDefault();if(busy)return;clear();
    var v=email.value.trim();
    if(!validEmail(v)){msg(he,'Format email belum benar.',$('#fe'));email.focus();return}
    if(pw.value.length<8){msg(hp,'Email atau kata sandi belum cocok. Coba cek lagi ya.',$('#fp'));pw.focus();return}
    busy=true;go.disabled=true;go.textContent='Sebentar ya…';
    /* Tahap prototipe: belum ada server autentikasi. Ganti blok ini dengan panggilan API sungguhan. */
    setTimeout(function(){enter('acct',v)},700);
  });

  $('#guest').addEventListener('click',function(){enter('guest')});
  $('#google').addEventListener('click',function(){toast('Masuk dengan Google butuh konfigurasi server (OAuth). Pakai email atau Mode Tamu dulu ya.')});

  document.querySelectorAll('[data-goto]').forEach(function(a){
    a.addEventListener('click',function(){try{sessionStorage.setItem('mula.goto',a.dataset.goto)}catch(e){}});
  });
})();
</script>
</body>
</html>
