<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MULA — Siapkan Dulu 20 Detik</title>
  <link rel="stylesheet" href="css/mula-theme.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EBE7D5] flex justify-center items-center min-h-screen">

  <div class="mula-shell pb-24 justify-between">
    
    <div>
      <!-- Top Olive Header Banner -->
      <header class="mula-header flex items-center gap-3">
        <a href="mulai-langkah.html" class="p-1 rounded-full hover:bg-black/10 transition" title="Kembali">
          <span class="material-symbols-outlined text-[24px]">arrow_back</span>
        </a>
        <div>
          <h1 class="text-xl font-bold">Siapkan dulu, 20 detik saja</h1>
          <p class="text-xs">Beri ruang jeda sebelum melangkah.</p>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="p-6 flex flex-col items-center text-center">
        
        <!-- Tunny Cheering Mascot -->
        <div class="w-20 h-20 my-2 flex items-center justify-center">
          <svg width="76" height="76" viewBox="0 0 100 100" fill="none">
            <path d="M48 24C44 14 36 12 33 14C30 16 31 24 43 28C47 29.5 48 26 48 24Z" fill="#90A955"/>
            <path d="M52 24C56 14 64 12 67 14C70 16 69 24 57 28C53 29.5 52 26 52 24Z" fill="#758B42"/>
            <ellipse cx="50" cy="58" rx="26" ry="24" fill="#F4E6D0"/>
            <circle cx="43" cy="52" r="3.5" fill="#132A13"/>
            <circle cx="57" cy="52" r="3.5" fill="#132A13"/>
            <ellipse cx="38" cy="58" rx="4.5" ry="3" fill="#FFAAA6"/>
            <ellipse cx="62" cy="58" rx="4.5" ry="3" fill="#FFAAA6"/>
            <ellipse cx="50" cy="62" rx="4" ry="4" fill="#132A13"/>
          </svg>
        </div>

        <!-- Yellow Calm Banner -->
        <div class="card-yellow w-full py-2 px-4 text-xs font-bold text-[#132A13] mb-4 text-center">
          Tarik napas dulu...
        </div>

        <!-- 20s Countdown & Checklist Card -->
        <div class="card-white w-full p-4 flex flex-col gap-3 text-left border border-[#31572C]/10">
          
          <div class="flex items-center justify-between pb-2 border-b border-black/5">
            <span class="text-xs font-bold text-[#31572C] uppercase tracking-wider">Persiapan Ringan</span>
            <span class="text-sm font-extrabold text-[#132A13] bg-[#AEF1CC] px-2.5 py-0.5 rounded-full" id="prepTimer">
              20 detik
            </span>
          </div>

          <label class="flex items-center gap-3 cursor-pointer py-1">
            <input type="checkbox" id="chk1" checked class="w-4 h-4 accent-[#31572C] rounded"/>
            <span class="text-xs font-medium text-[#132A13]">Matikan notifikasi sementara</span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer py-1">
            <input type="checkbox" id="chk2" checked class="w-4 h-4 accent-[#31572C] rounded"/>
            <span class="text-xs font-medium text-[#132A13]">Siapkan dokumen atau bukumu</span>
          </label>

          <label class="flex items-center gap-3 cursor-pointer py-1">
            <input type="checkbox" id="chk3" checked class="w-4 h-4 accent-[#31572C] rounded"/>
            <span class="text-xs font-medium text-[#132A13]">Tarik napas perlahan-lahan</span>
          </label>

        </div>

      </main>
    </div>

    <!-- Bottom Buttons Area -->
    <div class="p-6 flex flex-col gap-2.5">
      <button onclick="goToTimer()" class="btn-primary py-3.5 shadow-md">
        Aku Siap
      </button>
      <button onclick="goToTimer()" class="text-xs text-[#7A8782] py-1.5 text-center hover:underline">
        Lewati
      </button>
      <a href="napas.html" class="btn-secondary py-2.5 text-xs font-semibold bg-white flex items-center justify-center gap-1.5 mt-1">
        <span class="material-symbols-outlined text-[18px] text-[#31572C]">air</span>
        <span>Napas 1 Menit</span>
      </a>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="mula-nav">
      <a href="home.html" class="mula-nav-item">
        <span class="material-symbols-outlined">home</span>
        <span>Beranda</span>
      </a>
      <a href="mulai-jenis-tugas.html" class="mula-nav-item active">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">timer</span>
        <span>Mulai</span>
      </a>
      <a href="sos-deadline.html" class="mula-nav-item">
        <span class="material-symbols-outlined">emergency</span>
        <span>SOS</span>
      </a>
      <a href="jejak-langkah.html" class="mula-nav-item">
        <span class="material-symbols-outlined">footprint</span>
        <span>Jejak</span>
      </a>
    </nav>

  </div>

  <script>
    let timeLeft = 20;
    const timerEl = document.getElementById('prepTimer');
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        timerEl.textContent = 'Siap!';
      } else {
        timerEl.textContent = `${timeLeft} detik`;
      }
    }, 1000);

    function goToTimer() {
      clearInterval(interval);
      window.location.href = 'mulai-timer.html';
    }
  </script>
</body>
</html>
