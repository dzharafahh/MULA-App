<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#90A955">
<title>Mulai 2 Menit — MULA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#132A13;--deep:#31572C;--olive:#90A955;--mint:#AEF1CC;--yel:#FFF7AF;--peach:#FFE5D9;--cream:#F8F5E4;--soft:#FEFEFE;--body:#404943;--sage:#7A8782;--bg:#EBEEE6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--body);display:flex;align-items:center;justify-content:center}
.screen{position:relative;width:100%;max-width:402px;height:100dvh;max-height:874px;background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.screen{border-radius:38px;box-shadow:0 24px 70px rgba(19,42,19,.18)}}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}

.hd{flex-shrink:0;background:var(--olive);color:var(--ink);border-radius:0 0 26px 26px;padding:calc(30px + env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;gap:12px;min-height:104px}
.hd h1{font-size:19px;font-weight:700;line-height:1.2;flex:1}
.back{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center}
.bd{flex:1;overflow-y:auto;padding:14px 18px 122px;-webkit-overflow-scrolling:touch}
.bd.nonav{padding-bottom:28px}
h2{font-size:20px;font-weight:800;line-height:1.25;color:var(--deep);margin:6px 0 10px}
h3{font-size:22px;font-weight:800;color:var(--deep);margin:2px 0 6px}
p{font-size:14px;line-height:1.5;color:var(--body);margin:4px 0}
.tiny{font:400 11px 'Nunito','Plus Jakarta Sans',sans-serif;color:var(--body);margin:6px 0}
.lbl{font:600 11px 'Nunito','Plus Jakarta Sans',sans-serif;color:var(--ink);display:block;margin:12px 0 5px}
.tn{display:block;height:auto}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:999px;background:var(--soft);color:var(--ink);font-size:14px;font-weight:700;padding:0 16px;margin:8px 0;box-shadow:0 1px 3px rgba(19,42,19,.08)}
.btn.p{background:var(--deep);color:#fff;box-shadow:none}
.btn[disabled]{background:var(--sage);color:#fff;cursor:not-allowed;box-shadow:none}
.note{background:var(--yel);border-radius:16px;padding:12px 16px;text-align:center;font-size:13px;line-height:1.4;color:var(--body);margin:12px 0}

.act{position:relative;border-radius:22px;padding:14px 16px 16px;margin:12px 0}
.act small{font:600 11px 'Nunito','Plus Jakarta Sans',sans-serif;color:var(--body);display:block}
.act h3{margin:2px 0 8px}
.act img{position:absolute;right:14px;top:14px;width:46px}
.act p{padding-right:54px}
.act .btn{margin:12px 0 0}
.card{background:var(--soft);border-radius:16px;padding:14px;margin:8px 0}
.card b{font-size:15px;color:var(--deep)}
.bar{height:7px;background:var(--mint);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--deep);border-radius:9px}

.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:16px;padding:12px 16px;margin:10px 0;min-height:48px;color:var(--deep);font-size:14px;font-weight:700}
.opt.pk{background:var(--peach);padding:12px 14px}
.opt.on{border-color:var(--deep)}
.opt .r{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--deep);display:grid;place-items:center}
.opt.on .r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--deep)}
.opt.c .r{border-radius:6px}
.opt.c.on .r{background:var(--deep)}
.opt.c.on .r::after{background:#fff;border-radius:2px;width:9px;height:9px}
.opt small{display:block;font:400 11px 'Nunito','Plus Jakarta Sans',sans-serif;color:var(--body);margin-top:2px;line-height:1.35}
.opt.plain{color:var(--ink);font-weight:500}
.opt.chk{background:transparent;padding:8px 0;margin:4px 0;min-height:44px;font-weight:500;color:var(--ink)}

.ring{width:200px;height:200px;border-radius:50%;background:var(--mint);border:7px solid var(--deep);margin:16px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--deep)}
.ring b{font-size:24px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ring span{font:400 10px 'Nunito','Plus Jakarta Sans',sans-serif;margin-top:10px;color:var(--body)}
.field{background:var(--soft);border-radius:14px;padding:0 14px}
.field textarea{width:100%;border:0;background:transparent;min-height:84px;padding:12px 0;resize:vertical;font-size:14px;color:var(--ink);outline:0}
.field:focus-within{outline:3px solid var(--deep)}

.nav{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--deep);border-radius:999px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 6px 16px rgba(19,42,19,.3)}
.nav button{background:0;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;min-width:64px;min-height:50px}
.nav button[aria-current]{color:var(--sage)}
.nav svg{width:24px;height:24px;fill:currentColor}
.toast{position:absolute;left:18px;right:18px;top:calc(14px + env(safe-area-inset-top));background:var(--mint);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;text-align:center;z-index:9;box-shadow:0 6px 16px rgba(0,0,0,.15)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="screen" id="app"></div>

<script>
(function(){
'use strict';
var KEY='mula.v2',TKEY='mula.tk',DAY=864e5,Q=new URLSearchParams(location.search);
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---- state bersama (localStorage) ---- */
var S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S.user=S.user||{};S.ses=S.ses||[];S.notes=S.notes||[];S.tasks=S.tasks||[];S.ms=S.ms||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var CONT=+S.user.cont||10,NAMA=S.user.name||(Q.get('demo')==='1'?'Niki':'');

/* ---- konten ---- */
var HAM=[['Takut','Takut hasilnya jelek, takut revisi banyak, atau cemas dihakimi.'],['Bingung','Banyak sekali yang harus dikerjakan sampai tidak tahu mulai dari mana.'],['Lelah','Baterai fisik dan mental tiris, kepala terasa berat untuk berpikir.'],['Malas','Awal terasa sangat berat, butuh dorongan ekstra.'],['Panik','Deadline terasa sudah dekat sekali.']];
var JENIS=['Skripsi','Laporan Praktikum','Presentasi','Belajar Ujian','Tugas Kelompok','Urusan Akademik'];
var MOODMAP={'Bingung':'Bingung','Kewalahan':'Panik','Lelah':'Lelah','Takut Memulai':'Takut'};
var BANK={
Takut:['Buka dokumen revisi dan baca satu komentar dosen.','Buka filenya dan lihat saja dulu, belum perlu diubah.','Tulis satu hal yang paling kamu takutkan, lalu tutup catatannya.','Tulis satu kalimat kasar dulu, tidak perlu bagus.','Buka dokumenmu dan baca judulnya saja.'],
Bingung:['Tuliskan tiga hal yang harus dikerjakan.','Tulis judul tugas di bagian paling atas halaman kosong.','Pilih satu bagian yang paling mudah dan beri tanda bintang.','Tulis satu pertanyaan yang belum kamu pahami.','Cari satu contoh tugas serupa dan lihat sekilas.'],
Lelah:['Rapikan satu bagian tugas tanpa memaksakan diri.','Baca ulang satu paragraf, tidak perlu menulis apa-apa.','Minum seteguk air, lalu buka filenya saja.','Regangkan bahu sebentar, lalu buka filenya.','Tulis satu baris tentang apa yang akan dikerjakan besok.'],
Malas:['Buka laptop dan siapkan file tugas.','Taruh ponsel di luar jangkauan, lalu buka dokumenmu.','Tulis satu kalimat apa saja di dokumen.','Ketik judul tugas di dokumenmu.','Tulis satu poin saja, lalu berhenti kalau mau.'],
Panik:['Tuliskan satu deadline yang paling dekat.','Tulis tiga tugas dan urutkan dari yang paling mendesak.','Pilih satu tugas paling dekat dan buka filenya.','Tarik napas, lalu tulis satu hal yang bisa selesai hari ini.','Tutup tab lain, sisakan hanya tugas paling dekat.']};
var SPEC={'Skripsi':'Buka bab yang sedang kamu kerjakan dan baca satu paragraf.','Laporan Praktikum':'Mulai dengan menuliskan satu kalimat mengenai tujuan praktikum.','Presentasi':'Buka file presentasimu dan tuliskan satu judul slide.','Belajar Ujian':'Buka catatanmu dan baca satu halaman saja.','Tugas Kelompok':'Kirim satu pesan singkat ke grup tentang pembagian tugas.','Urusan Akademik':'Buka portal kampus dan catat satu hal yang perlu diurus.'};

/* ---- ikon ---- */
var I={back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#132A13" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
home:'<svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>',
mulai:'<svg viewBox="0 0 24 24"><path d="M9 1.5h6V4H9zM19 6l1.6 1.6-1.6 1.6z"/><path fill-rule="evenodd" d="M12 5a8.500 8.500 0 100 17 8.500 8.500 0 000-17zm-1 4h2v4.400l2.800 1.700-1 1.700L11 14.500z"/></svg>',
sos:'<svg viewBox="0 0 24 24"><path d="M5 19v-5a7 7 0 0114 0v5h2v2H3v-2zM11 2h2v3h-2zM3.500 5.400L4.900 4l2 2-1.400 1.400zM19.100 4l1.400 1.400-2 2L17.100 6z"/></svg>',
jejak:'<svg viewBox="0 0 24 24"><ellipse cx="8" cy="9" rx="3" ry="5"/><ellipse cx="16" cy="15" rx="3" ry="5"/><circle cx="6" cy="3" r="1.300"/><circle cx="9" cy="2.500" r="1.300"/><circle cx="14" cy="9" r="1.300"/><circle cx="17" cy="8.500" r="1.300"/></svg>'};
function T(n,w){return '<img class="tn" src="img/'+n+'.png" alt="" width="'+w+'">'}
function btn(t,a,c,x){return '<button class="btn '+(c||'')+'" data-a="'+a+'" '+(x||'')+'>'+t+'</button>'}
function opt(t,k,v,on,c,sub){return '<button class="opt '+(c||'')+(on?' on':'')+'" data-a="pick" data-k="'+k+'" data-v="'+esc(v)+'" role="'+(/\bc\b/.test(c||'')?'checkbox':'radio')+'" aria-checked="'+!!on+'"><span class="r"></span><span>'+esc(t)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></button>'}
function fm(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

/* ---- state alur ---- */
var R='mulai',H=[],F={h:null,j:null,step:'',sw:0,feel:'',nt:'',tried:0,ck:{}},TK=null,TI=0,RI=0,WL=null;
try{TK=JSON.parse(localStorage.getItem(TKEY))}catch(e){}

function pickStep(){var b=BANK[F.h].concat(F.j?[SPEC[F.j]]:[]),s,i=0;do{s=b[Math.floor(Math.random()*b.length)]}while(s===F.step&&b.length>1&&i++<30);F.step=s}
function go(r,rp){if(!rp)H.push(R);R=r;render()}
function back(){R=H.pop()||'mulai';render()}
function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;$('#app').appendChild(d);setTimeout(function(){d.remove()},2800)}
function goApp(r){try{sessionStorage.setItem('mula.goto',r)}catch(e){}location.href='index.html'}

/* ---- timer: dihitung dari waktu mulai, bukan detik layar ---- */
function lf(){return TK?Math.max(0,Math.ceil((TK.pause!=null?TK.pause:TK.end-Date.now())/1000)):0}
function persist(){try{TK?localStorage.setItem(TKEY,JSON.stringify(TK)):localStorage.removeItem(TKEY)}catch(e){}}
function startT(sec,kind){TK={end:Date.now()+sec*1000,tot:sec,kind:kind,pause:null,h:F.h,j:F.j,step:F.step};persist();
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){WL=w}).catch(function(){})}catch(e){}}
function stopT(){clearInterval(TI);TK=null;persist();try{if(WL){WL.release();WL=null}}catch(e){}}
function tick(){
  if(!TK)return;var l=lf(),e=$('#tm');if(e)e.textContent=fm(l);
  var b=$('#tb');if(b&&TK.kind==='two'&&TK.pause==null&&l<=TK.tot/2)b.textContent='Setengah jalan. Kamu keren!';
  if(l<=0)endT();
}
function endT(){
  var k=TK.kind;stopT();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(k==='two'){rec('selesai');go('next',1)}else if(k==='cont')go('contdone',1);else go('apres',1);
}
function days(){var s={};S.ses.forEach(function(x){var d=new Date(x.d);s[d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()]=1});return Object.keys(s).length}
function rec(st){
  S.ses.push({d:Date.now(),h:F.h,j:F.j,step:F.step,st:st});save();
  var n=S.ses.filter(function(x){return x.st==='selesai'}).length;
  [['1',n>=1,'Langkah pertama! Tunny bangga padamu.'],['5',n>=5,'5 sesi sudah. Kamu makin akrab dengan memulai.'],['7',days()>=7,'7 hari memulai. Pelan-pelan, tapi pasti.']].forEach(function(m){
    if(m[1]&&S.ms.indexOf(m[0])<0){S.ms.push(m[0]);save();setTimeout(function(){toast(m[2])},400)}});
}

/* ---- layar ---- */
var SC={
mulai:function(){
  var lt=S.tasks.filter(function(t){return t.st!=='Selesai'}).sort(function(a,b){return(b.lt||0)-(a.lt||0)})[0];
  var pr=lt?lt.stages.filter(function(s){return s.st==='Selesai'}).length:0;
  return{t:'Mau mulai dari mana?',nav:1,h:
   '<p>Pilih cara yang paling nyaman untuk memecah rasa engganmu hari ini. Sedikit saja sudah cukup.</p>'+
   '<div class="act" style="background:var(--peach)"><small>Acak</small><h3>Mulai Cepat</h3>'+T('e13',46)+'<p>Belum tahu harus apa? Dapatkan satu langkah kecil acak sekarang tanpa perlu merencanakan.</p>'+btn('Buka','quick')+'</div>'+
   '<div class="act" style="background:var(--mint)"><small>Terstruktur</small><h3>Tugas Saya</h3>'+T('e12',46)+'<p>Pecah tugas besar jadi remahan langkah kecil yang terasa ramah di kepala.</p>'+btn('Buka','tugas')+'</div>'+
   '<h2>Lanjutkan tugas terakhir</h2>'+
   (lt?'<div class="card"><b>'+esc(lt.judul)+'</b><p class="tiny">'+pr+' dari '+lt.stages.length+' langkah selesai</p><div class="bar"><i style="width:'+pr/Math.max(1,lt.stages.length)*100+'%"></i></div>'+btn('Buka','tugas')+'</div>':'<p>Belum ada tugas terakhir. Tambahkan lewat Tugas Saya.</p>')};
},
jenis:function(){return{t:'Ini soal tugas apa?',b:1,nav:1,h:'<p>Pilih yang paling dekat. Tidak harus pas.</p>'+JENIS.map(function(j){return opt(j,'j',j,F.j===j,'plain')}).join('')+btn('Lanjut','jnext','p',F.j?'':'disabled')}},
hambatan:function(){return{t:'Apa yang sedang menghalangimu?',b:1,nav:1,h:'<p>Wajar merasa tertahan. Mengakui rasa enggan adalah kunci agar beban tidak menumpuk.</p>'+HAM.map(function(x){return opt(x[0],'h',x[0],F.h===x[0],'pk',x[1])}).join('')+btn('Lanjut','hnext','p',F.h?'':'disabled')}},
langkah:function(){return{t:'Langkah 2 menit',b:1,nav:1,h:'<div>'+T('e06',68)+'</div><div class="note">Ini langkah kecil untukmu.</div><p class="tiny">Langkah 2 menit</p><h2 style="font-size:21px">'+esc(F.step)+'</h2><p>Kerjakan selama dua menit saja. Setelah itu bebas, mau lanjut atau berhenti.</p>'+btn('Siap, Mulai','ritual','p')+btn('Ganti langkah','swap','',F.sw>=3?'disabled':'')+'<p class="tiny">Ganti langkah · '+F.sw+' dari 3</p>'}},
ritual:function(){return{t:'Siapkan dulu, 20 detik saja',b:1,h:'<div>'+T('e07',48)+'</div><div class="note" id="rn">Tarik napas dulu…</div><h2>'+'<span id="rt">20</span> detik</h2>'+
   ['Matikan notifikasi','Siapkan dokumen atau bukumu','Tarik napas pelan-pelan'].map(function(x,i){return opt(x,'ck',i,F.ck[i],'c chk')}).join('')+
   '<p class="tiny">Tarik napas… · Hembuskan pelan…</p>'+btn('Aku Siap','begin','p')+btn('Lewati','begin')+btn('Napas 1 Menit','napas'),
   after:function(){clearInterval(RI);F.rs=20;var t0=Date.now();RI=setInterval(function(){
     if(R!=='ritual'){clearInterval(RI);return}var n=Math.max(0,20-Math.floor((Date.now()-t0)/1000)),e=$('#rt'),r=$('#rn');
     if(e)e.textContent=n;if(r)r.textContent=Math.floor((Date.now()-t0)/4000)%2?'Hembuskan pelan…':'Tarik napas dulu…';
     if(n<=0){clearInterval(RI);if(r)r.textContent='Siap? Tekan Aku Siap kapan pun kamu mau.'}},500)}}},
timer:function(){
  if(!TK)return SC.mulai();
  var k=TK.kind,pz=TK.pause!=null,rest=k==='rest',ttl=pz?'Timer dijeda':rest?'Istirahat 5 Menit':k==='cont'?'Lanjut '+CONT+' Menit':'Mulai 2 Menit';
  var half=k==='two'&&!pz&&lf()<=TK.tot/2;
  return{t:ttl,b:1,h:(rest?'<div>'+T('p_think',74)+'</div>':'<p class="tiny" style="margin-top:0">Langkahmu</p><h2>'+esc(TK.step||F.step||'Fokus pada satu hal.')+'</h2>')+
   '<div class="ring" role="timer" aria-label="Sisa waktu"><b id="tm">'+fm(lf())+'</b><span>Satu langkah kecil</span></div>'+
   (rest?'<h2>Istirahat juga bagian dari proses.</h2><p>Lepaskan pandangan dari layar, minum air, atau regangkan badan.</p>'+btn('Selesai istirahat','restdone','p')
    :(k==='two'?(pz?'<p>Jeda dulu tidak apa-apa. Lanjut kapan pun kamu siap.</p>':'<div class="note" id="tb">'+(half?'Setengah jalan. Kamu keren!':'Aku di sini. 2 menit saja.')+'</div>'):'')+btn(pz?'Lanjut':'Jeda','pause','p')+btn(k==='two'?'Selesai Lebih Awal':'Selesai','early')),
   after:function(){clearInterval(TI);TI=setInterval(tick,250);tick()}};
},
exit:function(){return{t:'Mau berhenti sekarang?',b:1,h:'<h2>Mau berhenti sekarang? Percobaanmu tetap kami catat.</h2>'+btn('Lanjut Mulai','resume','p')+btn('Berhenti','stop')}},
next:function(){return{t:'2 menit selesai!',b:1,nav:1,h:'<div>'+T('e06',48)+'</div><p style="margin-top:12px">Kamu sudah memulai. Sekarang kamu bebas memilih.</p>'+btn('Lanjut '+CONT+' Menit','cont','p')+btn('Cukup untuk Hari Ini','apresgo')}},
contdone:function(){return{t:'Sesi lanjutan selesai',b:1,nav:1,h:'<div>'+T('e06',48)+'</div><h2 style="margin-top:12px">'+CONT+' menit selesai. Luar biasa. Mau istirahat sebentar?</h2>'+btn('Istirahat 5 Menit','rest','p')+btn('Selesai','apresgo')}},
apres:function(){var tr=F.tried;return{t:'Apresiasi dan Refleksi',b:1,nav:1,h:'<div>'+T('e06',48)+'</div><h2 style="margin-top:12px">Terima kasih sudah mencoba'+(NAMA?', '+esc(NAMA):'')+'</h2><p>Kamu berhasil mengalahkan rasa enggan untuk memulai. Itu bagian yang paling sulit.</p><div class="note">Kamu berhasil memulai. Aku bangga!</div><h2>'+(tr?'Percobaan tercatat · tanpa menambah sesi selesai':'+1 sesi Mulai 2 Menit · +1 langkah kecil')+'</h2><p class="tiny" style="font-size:12px">Bagaimana rasanya sekarang?</p>'+
   ['Lebih ringan','Biasa saja','Masih berat'].map(function(x){return opt(x,'feel',x,F.feel===x,'plain')}).join('')+
   (F.feel==='Masih berat'?'<div class="note">Tidak apa-apa. Besok kita coba lagi dengan langkah yang lebih kecil.</div>':'')+
   '<label class="lbl" for="nt">Tulis catatan singkat (opsional)</label><div class="field"><textarea id="nt">'+esc(F.nt)+'</textarea></div>'+btn('Simpan ke Jejak Langkah','savenote','p')+btn('Lewati','skip')}}
};

/* ---- render ---- */
function render(){
  var s=SC[R](),el=$('#app');
  el.innerHTML='<header class="hd">'+(s.b?'<button class="back" data-a="back" aria-label="Kembali">'+I.back+'</button>':'')+'<h1>'+s.t+'</h1></header>'+
   '<main class="bd'+(s.nav?'':' nonav')+'" id="main">'+s.h+'</main>'+
   (s.nav?'<nav class="nav" aria-label="Navigasi utama">'+[['home','Beranda'],['mulai','Mulai'],['sos','SOS'],['jejak','Jejak']].map(function(x){return '<button data-n="'+x[0]+'"'+(x[0]==='mulai'?' aria-current="page"':'')+'>'+I[x[0]]+x[1]+'</button>'}).join('')+'</nav>':'');
  if(s.after)s.after();
}

/* ---- aksi ---- */
var A={
back:function(){if(R==='timer'&&TK&&TK.kind==='two')go('exit');else back()},
quick:function(){F.j=null;F.h=null;go('hambatan')},
tugas:function(){goApp('tugas')},
jnext:function(){go('hambatan')},
hnext:function(){F.sw=0;pickStep();go('langkah')},
swap:function(){if(F.sw<3){F.sw++;pickStep();render()}},
ritual:function(){go('ritual')},
napas:function(){goApp('napas')},
begin:function(){clearInterval(RI);startT(120,'two');go('timer',1)},
pause:function(){if(TK.pause==null)TK.pause=TK.end-Date.now();else{TK.end=Date.now()+TK.pause;TK.pause=null}persist();render()},
early:function(){if(TK.kind==='two')go('exit');else{var k=TK.kind;stopT();go(k==='cont'?'contdone':'apres',1)}},
resume:function(){back()},
stop:function(){F.step=TK?TK.step:F.step;stopT();rec('percobaan');F.tried=1;H=['mulai'];go('apres',1)},
cont:function(){startT(CONT*60,'cont');go('timer',1)},
rest:function(){startT(300,'rest');go('timer',1)},
restdone:function(){stopT();go('apres',1)},
apresgo:function(){F.tried=0;go('apres',1)},
savenote:function(){var t=(F.nt||'').trim();if(F.feel||t){S.notes.push({id:Date.now().toString(36),d:Date.now(),feel:F.feel,text:t});save()}goApp('jejak')},
skip:function(){location.href='home.html'},
pick:function(e){var k=e.dataset.k,v=e.dataset.v;
  if(k==='ck')F.ck[v]=!F.ck[v];else F[k]=v;
  var m=$('#main'),y=m?m.scrollTop:0;if(R==='ritual'){var c=F.ck;render();F.ck=c}else render();var m2=$('#main');if(m2)m2.scrollTop=y}
};
document.addEventListener('click',function(e){
  var n=e.target.closest('[data-n]');
  if(n){var v=n.dataset.n;if(v==='home')location.href='home.html';else if(v==='mulai'){H=[];R='mulai';render()}else goApp(v);return}
  var a=e.target.closest('[data-a]');if(!a||a.disabled)return;var f=A[a.dataset.a];if(f)f(a);
});
document.addEventListener('input',function(e){if(e.target.id==='nt')F.nt=e.target.value});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&TK&&R==='timer')tick()});

/* ---- mulai ---- */
/* masuk dari Beranda: kondisi terpilih dilewati ke hambatan (M3 dilewati) */
var s0=Q.get('s'),mood=Q.get('mood')||'';
if(s0==='flow'){try{mood=sessionStorage.getItem('mula.mood')||''}catch(e){}}
if(s0==='flow'||Q.get('mood')){
  if(MOODMAP[mood]){F.h=MOODMAP[mood];pickStep();R='langkah';H=['mulai']}else{R='hambatan';H=['mulai']}
}else if(TK&&lf()>0){
  R='timer';H=['mulai'];F.step=TK.step;
}else if(TK){var kk=TK.kind;F.step=TK.step;F.h=TK.h;F.j=TK.j;stopT();if(kk==='two'){rec('selesai');R='next'}else R=kk==='cont'?'contdone':'apres';H=['mulai']}
/* pratinjau desain per layar: ?s=jenis|hambatan|langkah|ritual|timer|jeda|exit|next|contdone|rest|apres|percobaan */
else if(s0){
  F.h='Bingung';F.j='Laporan Praktikum';F.step='Tuliskan tiga hal yang harus dikerjakan.';
  var pv={jenis:'jenis',hambatan:'hambatan',langkah:'langkah',ritual:'ritual',exit:'exit',next:'next',contdone:'contdone',apres:'apres',percobaan:'apres'}[s0];
  if(s0==='percobaan')F.tried=1;
  if(pv){R=pv;H=['mulai']}
  else if(s0==='timer'||s0==='jeda'||s0==='rest'){startT(s0==='rest'?300:120,s0==='rest'?'rest':'two');if(s0==='jeda')TK.pause=120000;try{localStorage.removeItem(TKEY)}catch(e){}R='timer';H=['mulai']}
}
render();
})();
