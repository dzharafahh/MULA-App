<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>MULA — Masuk</title>
  <link rel="stylesheet" href="css/mula-theme.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EBE7D5] flex justify-center items-center min-h-screen">

  <div class="mula-shell justify-between p-6">
    
    <!-- Top Content -->
    <div class="flex flex-col w-full pt-4">
      
      <!-- Brand Logo Minimal -->
      <div class="flex items-center gap-2 mb-6">
        <span class="text-2xl font-extrabold text-[#31572C]">mùla</span>
      </div>

      <!-- Welcome Heading -->
      <h1 class="text-2xl font-bold text-[#132A13] mb-2 tracking-tight">Selamat datang kembali</h1>
      <p class="text-sm text-[#404943] leading-relaxed mb-6">
        Masuk untuk menyimpan Jejak Langkahmu, atau mulai langsung tanpa akun.
      </p>

      <!-- Form -->
      <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
        
        <!-- Email Input -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-[#132A13] px-1">Email</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-[#7A8782] text-[20px]">mail</span>
            <input type="email" id="email" required placeholder="nama@gmail.com" class="mula-input pl-11 text-sm"/>
          </div>
        </div>

        <!-- Password Input -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-[#132A13] px-1">Kata Sandi</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-[#7A8782] text-[20px]">lock</span>
            <input type="password" id="password" required placeholder="••••••••" class="mula-input pl-11 pr-11 text-sm"/>
            <button type="button" onclick="togglePass()" class="absolute right-3.5 text-[#7A8782] hover:text-[#132A13] flex items-center">
              <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
            </button>
          </div>
          <div class="flex justify-end pt-1">
            <button type="button" onclick="openForgotModal()" class="text-xs font-semibold text-[#31572C] hover:underline">
              Lupa kata sandi?
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary mt-2">
          Masuk
        </button>

      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-[1px] bg-black/10"></div>
        <span class="text-xs text-[#7A8782]">atau</span>
        <div class="flex-1 h-[1px] bg-black/10"></div>
      </div>

      <!-- Alternative Auth -->
      <div class="flex flex-col gap-2.5">
        
        <!-- Google Login -->
        <button type="button" onclick="loginWithGoogle()" class="btn-secondary gap-3 bg-[#FEFEFE] hover:bg-[#F2EEE1] transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
            <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
            <path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
            <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
          </svg>
          <span class="text-sm font-semibold">Lanjutkan dengan Google</span>
        </button>

        <!-- Guest Login -->
        <button type="button" onclick="loginGuest()" class="btn-secondary bg-[#FEFEFE] hover:bg-[#F2EEE1] transition">
          <span class="material-symbols-outlined text-[18px] text-[#31572C]">eco</span>
          <span class="text-sm font-semibold">Lanjut Tanpa Akun</span>
        </button>

      </div>

    </div>

    <!-- Bottom Footer -->
    <div class="flex flex-col items-center gap-2 pt-6 pb-2 text-center">
      <p class="text-xs text-[#7A8782]">Data tersimpan di perangkat ini saja.</p>
      <div class="text-sm text-[#404943]">
        Belum punya akun? <a href="register.html" class="font-bold text-[#31572C] hover:underline">Daftar</a>
      </div>
    </div>

  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#F8F5E4] rounded-3xl p-6 w-full max-w-[360px] shadow-2xl flex flex-col gap-4 border border-[#31572C]/10">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-[#132A13]">Lupa kata sandi?</h3>
        <button onclick="closeForgotModal()" class="text-[#7A8782] hover:text-black">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <p class="text-xs text-[#404943] leading-relaxed">
        Tenang, kuncinya biasa. Masukkan emailmu, kami kirimkan tautan untuk membuat kata sandi baru.
      </p>
      <input type="email" id="forgotEmail" placeholder="nama@gmail.com" class="mula-input text-sm"/>
      <button onclick="sendForgot()" class="btn-primary">
        Kirim Tautan
      </button>
    </div>
  </div>

  <script>
    function togglePass() {
      const p = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (p.type === 'password') {
        p.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        p.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const name = email.split('@')[0];
      const capitalized = name.charAt(0).toUpperCase() + name.slice(1);
      localStorage.setItem('mula_user', capitalized || 'Niki');
      localStorage.setItem('mula_email', email);
      window.location.href = 'home.html';
    }

    function loginWithGoogle() {
      localStorage.setItem('mula_user', 'Niki');
      localStorage.setItem('mula_email', 'niki@gmail.com');
      window.location.href = 'home.html';
    }

    function loginGuest() {
      localStorage.setItem('mula_user', 'Kawan MULA');
      localStorage.setItem('mula_email', 'tamu@mula.app');
      window.location.href = 'home.html';
    }

    function openForgotModal() {
      document.getElementById('forgotModal').classList.remove('hidden');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.add('hidden');
    }

    function sendForgot() {
      alert('Tautan atur ulang kata sandi telah dikirim ke emailmu!');
      closeForgotModal();
    }
  </script>
</body>
</html>
